<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000048">
    <meta name="robots" content="noindex">
    <title>Protocole de sécurité – Gare Issy RER – Demathieu Bard</title>
    <link rel="icon" href="assets/logo-demathieu-bard.png">
    <link rel="preload" href="assets/pages/page-1.jpg" as="image">
    <link rel="stylesheet" href="assets/css/app.css?v=2">
</head>
<body>

<header class="topbar">
    <img src="assets/logo-demathieu-bard.png" alt="Demathieu Bard" class="logo">
    <div class="titles">
        <h1 data-i18n="app.title">Protocole de sécurité</h1>
        <p data-i18n="app.subtitle">Chargement / Déchargement · Gare Issy RER</p>
    </div>
    <label class="lang">
        <span class="sr-only">Langue / Language</span>
        <select id="lang" aria-label="Langue / Language">
            <option value="fr">🇫🇷 FR</option>
            <option value="en">🇬🇧 EN</option>
            <option value="pt">🇵🇹 PT</option>
            <option value="es">🇪🇸 ES</option>
            <option value="pl">🇵🇱 PL</option>
            <option value="ro">🇷🇴 RO</option>
        </select>
    </label>
</header>

<nav class="progress" aria-label="Étapes">
    <ol id="steps"></ol>
</nav>

<noscript><p class="banner error">JavaScript est nécessaire pour remplir ce formulaire.</p></noscript>
<p id="restored" class="banner info" hidden data-i18n="draft.restored"></p>

<main id="app">
<form id="form" novalidate autocomplete="on">
    <!-- Pot de miel anti-robots : ne pas remplir -->
    <div class="hp" aria-hidden="true"><label>Site web <input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>

    <!-- ============================================================ 1. PROTOCOLE -->
    <section class="step" data-step="1">
        <h2 data-i18n="s1.title"></h2>
        <p class="lead" data-i18n="s1.intro"></p>

        <div class="card rules">
            <h3 data-i18n="s1.rulesTitle"></h3>
            <ol>
                <li data-i18n="rules.1"></li><li data-i18n="rules.2"></li><li data-i18n="rules.3"></li>
                <li data-i18n="rules.4"></li><li data-i18n="rules.5"></li><li data-i18n="rules.6"></li>
                <li data-i18n="rules.7"></li><li data-i18n="rules.8"></li><li data-i18n="rules.9"></li>
            </ol>
        </div>

        <details class="card doc" open>
            <summary data-i18n="s1.docTitle"></summary>
            <div class="pages">
                <a href="assets/pages/page-1.jpg" target="_blank" rel="noopener"><img src="assets/pages/page-1.jpg" alt="Protocole page 1/4" width="1034" height="1462"></a>
                <a href="assets/pages/page-2.jpg" target="_blank" rel="noopener"><img src="assets/pages/page-2.jpg" alt="Protocole page 2/4" width="1034" height="1462" loading="lazy"></a>
                <a href="assets/pages/page-3.jpg" target="_blank" rel="noopener"><img src="assets/pages/page-3.jpg" alt="Protocole page 3/4 – plan d'accès" width="1034" height="1462" loading="lazy"></a>
                <a href="assets/pages/page-4.jpg" target="_blank" rel="noopener"><img src="assets/pages/page-4.jpg" alt="Protocole page 4/4 – consignes" width="1034" height="1462" loading="lazy"></a>
            </div>
            <a class="btn ghost" href="assets/protocole-securite.pdf" target="_blank" rel="noopener">📄 <span data-i18n="s1.openPdf"></span></a>
        </details>

        <div class="field" data-field="lu_protocole">
            <label class="check big">
                <input type="checkbox" name="lu_protocole">
                <span data-i18n="s1.accept"></span>
            </label>
        </div>
    </section>

    <!-- ============================================================ 2. EPI -->
    <section class="step" data-step="2" hidden>
        <h2 data-i18n="s2.title"></h2>
        <p class="lead" data-i18n="s2.intro"></p>
        <div class="field" data-field="epi">
            <div class="options epi" data-group="epi"></div>
            <p class="counter" id="epiCount"></p>
        </div>
        <p class="banner warn" data-i18n="s2.warning"></p>
    </section>

    <!-- ============================================================ 3. IDENTITÉ -->
    <section class="step" data-step="3" hidden>
        <h2 data-i18n="s3.title"></h2>

        <div class="field" data-field="transporteur">
            <label for="transporteur"><span data-i18n="f.transporteur"></span> <b class="req">*</b></label>
            <input id="transporteur" name="transporteur" maxlength="80" autocomplete="organization" data-i18n-ph="f.transporteur.ph">
        </div>
        <div class="field" data-field="fournisseur">
            <label for="fournisseur"><span data-i18n="f.fournisseur"></span> <em class="opt" data-i18n="optional"></em></label>
            <input id="fournisseur" name="fournisseur" maxlength="80">
        </div>
        <div class="field" data-field="entreprise">
            <label for="entreprise"><span data-i18n="f.entreprise"></span> <b class="req">*</b></label>
            <input id="entreprise" name="entreprise" maxlength="80" list="entreprises">
            <small class="help" data-i18n="f.entreprise.help"></small>
            <datalist id="entreprises"></datalist>
        </div>
        <div class="field" data-field="nom">
            <label for="nom"><span data-i18n="f.nom"></span> <b class="req">*</b></label>
            <input id="nom" name="nom" maxlength="60" autocomplete="name">
        </div>
        <div class="row2">
            <div class="field" data-field="telephone">
                <label for="telephone"><span data-i18n="f.telephone"></span> <b class="req">*</b></label>
                <input id="telephone" name="telephone" type="tel" inputmode="tel" maxlength="25" autocomplete="tel" placeholder="06 12 34 56 78">
            </div>
            <div class="field" data-field="immatriculation">
                <label for="immatriculation"><span data-i18n="f.immatriculation"></span> <b class="req">*</b></label>
                <input id="immatriculation" name="immatriculation" maxlength="15" autocapitalize="characters" placeholder="AB-123-CD">
            </div>
        </div>
        <div class="field" data-field="adresse">
            <label for="adresse"><span data-i18n="f.adresse"></span> <em class="opt" data-i18n="optional"></em></label>
            <input id="adresse" name="adresse" maxlength="140" autocomplete="street-address">
        </div>
        <p class="note">💾 <span data-i18n="s3.remember"></span></p>
    </section>

    <!-- ============================================================ 4. VÉHICULE -->
    <section class="step" data-step="4" hidden>
        <h2 data-i18n="s4.title"></h2>

        <div class="field" data-field="tonnage">
            <p class="label"><span data-i18n="f.tonnage"></span> <b class="req">*</b></p>
            <div class="options two" data-group="tonnage"></div>
        </div>
        <div class="field" data-field="hauteur_ok">
            <p class="label with-icon"><img src="assets/icons/veh-hauteur.png" alt=""><span><span data-i18n="f.hauteur"></span> <b class="req">*</b></span></p>
            <div class="options yesno" data-group="hauteur_ok"></div>
        </div>
        <div class="field" data-field="longueur_ok">
            <p class="label with-icon"><img src="assets/icons/veh-longueur.png" alt=""><span><span data-i18n="f.longueur"></span> <b class="req">*</b></span></p>
            <div class="options yesno" data-group="longueur_ok"></div>
        </div>
        <div class="field" data-field="caracteristiques">
            <p class="label"><span data-i18n="f.caracteristiques"></span> <b class="req">*</b> <em class="opt" data-i18n="multi"></em></p>
            <div class="options" data-group="caracteristiques"></div>
            <input name="caracteristique_autre" maxlength="40" data-i18n-ph="f.caracteristique_autre" class="mt">
        </div>
        <div class="field" data-field="manutention">
            <p class="label"><span data-i18n="f.manutention"></span> <em class="opt" data-i18n="optional"></em></p>
            <small class="help" data-i18n="f.manutention.help"></small>
            <div class="options" data-group="manutention"></div>
        </div>
    </section>

    <!-- ============================================================ 5. MARCHANDISE -->
    <section class="step" data-step="5" hidden>
        <h2 data-i18n="s5.title"></h2>

        <div class="field" data-field="operation">
            <p class="label"><span data-i18n="f.operation"></span> <b class="req">*</b></p>
            <div class="options three text" data-group="operation"></div>
        </div>
        <div class="field" data-field="realisation">
            <p class="label"><span data-i18n="f.realisation"></span> <b class="req">*</b></p>
            <div class="options two text" data-group="realisation"></div>
        </div>
        <div class="field" data-field="matieres">
            <label for="matieres"><span data-i18n="f.matieres"></span> <b class="req">*</b></label>
            <textarea id="matieres" name="matieres" rows="3" maxlength="300" data-i18n-ph="f.matieres.ph"></textarea>
        </div>
        <div class="field" data-field="produits_dangereux">
            <p class="label"><span data-i18n="f.dangereux"></span> <b class="req">*</b></p>
            <div class="options yesno" data-group="produits_dangereux"></div>
        </div>
        <div class="field" data-field="dangers" id="dangersBlock" hidden>
            <p class="label"><span data-i18n="f.dangers"></span> <b class="req">*</b></p>
            <div class="options ghs" data-group="dangers"></div>
        </div>
        <div class="field" data-field="conditionnement">
            <p class="label"><span data-i18n="f.conditionnement"></span> <b class="req">*</b> <em class="opt" data-i18n="multi"></em></p>
            <div class="options" data-group="conditionnement"></div>
            <input name="conditionnement_autre" maxlength="40" data-i18n-ph="f.conditionnement_autre" class="mt">
        </div>
        <div class="field" data-field="poids_kg">
            <label for="poids_kg"><span data-i18n="f.poids"></span> <b class="req when-accueil" hidden>*</b></label>
            <input id="poids_kg" name="poids_kg" inputmode="decimal" maxlength="9" placeholder="kg">
        </div>
        <div class="field" data-field="dimensions">
            <p class="label"><span data-i18n="f.dims"></span> <b class="req when-accueil" hidden>*</b></p>
            <div class="row3">
                <div data-field="dim_longueur"><input name="dim_longueur" inputmode="decimal" maxlength="6" data-i18n-ph="dim.l" aria-label="Longueur"></div>
                <div data-field="dim_largeur"><input name="dim_largeur" inputmode="decimal" maxlength="6" data-i18n-ph="dim.w" aria-label="Largeur"></div>
                <div data-field="dim_hauteur"><input name="dim_hauteur" inputmode="decimal" maxlength="6" data-i18n-ph="dim.h" aria-label="Hauteur"></div>
            </div>
            <small class="help" data-i18n="f.poids.help"></small>
        </div>
    </section>

    <!-- ============================================================ 6. SIGNATURE -->
    <section class="step" data-step="6" hidden>
        <h2 data-i18n="s6.title"></h2>
        <div class="card recap">
            <h3 data-i18n="s6.recap"></h3>
            <dl id="recap"></dl>
        </div>

        <div class="field" data-field="signature">
            <p class="label"><span data-i18n="s6.sign"></span> <b class="req">*</b></p>
            <div class="sigwrap">
                <canvas id="signature" aria-label="Signature"></canvas>
                <button type="button" class="btn small ghost" id="clearSig">✕ <span data-i18n="s6.clear"></span></button>
            </div>
            <small class="help" data-i18n="s6.legal"></small>
        </div>

        <ul class="status">
            <li id="gpsStatus" class="wait" data-i18n="gps.wait"></li>
            <li id="serverStatus" class="wait" data-i18n="server.waking"></li>
        </ul>
    </section>

    <p id="formError" class="banner error" hidden role="alert"></p>

    <div class="nav">
        <button type="button" class="btn ghost" id="back">← <span data-i18n="nav.back"></span></button>
        <button type="button" class="btn primary" id="next"><span data-i18n="nav.next"></span> →</button>
        <button type="button" class="btn send" id="send" hidden>✔ <span data-i18n="nav.send"></span></button>
    </div>
</form>

<!-- ============================================================ CONFIRMATION -->
<section id="success" class="success" hidden aria-live="polite">
    <div class="tick" aria-hidden="true"><svg viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h2 data-i18n="ok.title"></h2>
    <p class="show" data-i18n="ok.show"></p>
    <dl class="okdata">
        <dt data-i18n="ok.ref"></dt><dd id="okRef" class="ref"></dd>
        <dt data-i18n="ok.date"></dt><dd id="okDate"></dd>
        <dt data-i18n="ok.driver"></dt><dd id="okDriver"></dd>
        <dt data-i18n="ok.company"></dt><dd id="okCompany"></dd>
        <dt data-i18n="ok.plate"></dt><dd id="okPlate"></dd>
    </dl>
    <p class="note" data-i18n="ok.sent"></p>
    <button type="button" class="btn ghost" id="restart" data-i18n="ok.new"></button>
</section>
</main>

<footer class="privacy"><p data-i18n="privacy"></p></footer>

<script src="assets/js/i18n.js?v=2"></script>
<script src="assets/js/app.js?v=2"></script>
</body>
</html>
